name: incident-command
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: development # Local loopback HTTP; use production behind HTTPS.
      PORT: 8787
      FRONTEND_URL: http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
