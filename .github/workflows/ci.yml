name: Verify application
on: [push, pull_request]
jobs:
  trained-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ml/requirements.txt
      - run: python -m pip install -r backend/ml/requirements.txt
      - run: python backend/ml/verify.py
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: incident_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run build --prefix backend && npm run build --prefix frontend
      - run: npm run test:collector
      - run: npm run test:setup
      - run: npm test --prefix backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:test@localhost:5432/incident_test
          SESSION_SECRET: integration-test-secret-at-least-32-characters
      - run: npm run lint --prefix frontend

  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t incident-command-backend:test backend
      - run: docker build -t incident-command-frontend:test frontend
      - run: docker build -f scripts/runtime/Dockerfile -t incident-command-kubernetes-collector:test .
      - name: Validate Compose without adding a root environment file
        run: |
          cp backend/.env.example backend/.env
          docker compose config --quiet
