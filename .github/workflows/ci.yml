name: Verify application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: incident_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run build --prefix backend && npm run build --prefix frontend
      - run: npm test --prefix backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:test@localhost:5432/incident_test
          SESSION_SECRET: integration-test-secret-at-least-32-characters
      - run: npm run lint --prefix frontend
